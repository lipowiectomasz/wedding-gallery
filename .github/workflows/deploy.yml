name: Deploy wedding-gallery

on:
  push:
    branches: [master]

env:
  DEPLOY_DIR: /home/deploy/wedding-gallery

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy bundle
        run: |
          mkdir -p _deploy
          cp docker-compose.prod.yml _deploy/
          cp -r frontend appwrite _deploy/

      - name: Copy files to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.env' --exclude='appwrite/.env'
          path: _deploy/
          remote_path: ${{ env.DEPLOY_DIR }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_SSH_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}

            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            cd appwrite
            docker compose --env-file .env build
            docker compose --env-file .env up -d
            cd ..

            sleep 10
            docker compose -f docker-compose.prod.yml ps
            docker compose -f appwrite/docker-compose.yml ps
